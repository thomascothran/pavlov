name: CI

on:
  push:
  pull_request:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
      - run: clojure -X:test

  clojurescript-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: clojure -M:dev:test -m shadow.cljs.devtools.cli compile test

  pavlov-core-squint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pavlov
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/pavlov/package-lock.json
      - run: npm ci
      - run: npm run test:squint

  pavlov-web-squint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/pavlov-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/pavlov-web/package-lock.json
      - run: npm ci
      - run: npm run test:squint

  squint-browser-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - run: npm ci
      - run: npm run build:squint

  squint-browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/web/package-lock.json
      - run: npm ci
      - run: npm run test:browser:squint
        env:
          CHROME_BIN: /usr/bin/google-chrome
