<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pavlov Explorer · Candidate C · Map</title>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    .c-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; }
    .mapwrap { overflow: auto; background:
      linear-gradient(rgba(143,245,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(143,245,255,.03) 1px, transparent 1px);
      background-size: 20px 20px; }
    svg text { font-family: var(--mono); font-size: 10px; fill: var(--dim); pointer-events: none; paint-order: stroke; stroke: #111; stroke-width: 4px; }
    .e { fill: none; stroke: #3a3a3a; stroke-width: 1.2; }
    .e.trace { stroke: var(--cyan); stroke-width: 2.5; filter: drop-shadow(0 0 4px rgba(143,245,255,.7)); }
    .e.next { stroke: var(--pink); stroke-width: 2; stroke-dasharray: 5 4; }
    text.trace { fill: var(--cyan); } text.next { fill: var(--pink); }
    .n { fill: var(--bg); stroke: #5a5a5a; stroke-width: 1.5; cursor: pointer; }
    .n:hover { stroke: var(--text); }
    .n.trace { fill: #0d4a50; stroke: var(--cyan); }
    .n.next { stroke: var(--pink); stroke-width: 2; }
    .n.here { fill: var(--cyan); stroke: var(--cyan); filter: drop-shadow(0 0 8px rgba(143,245,255,.9)); }
    text.tag { fill: var(--text); font-family: var(--head); font-size: 9px; letter-spacing: .15em; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
    .side .choice { padding: 9px 12px; }
    .tl { list-style: none; margin: 0; padding: 0; counter-reset: s; }
    .tl li button { display: block; width: 100%; padding: 4px 6px; }
    .tl li button:hover { background: var(--high); }
    .tl .ev-type { font-size: 12px; font-weight: 400; }
    .tl li.here .ev-type { color: var(--cyan); font-weight: 700; }
    .tl .num { display: inline-block; width: 22px; color: var(--dim); font-family: var(--head); font-size: 10px; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
  const layouts = {};
  function layout(p) {
    if (layouts[p.id]) return layouts[p.id];
    // layer = fewest events needed to get there; shortest route kept for click-to-jump
    const depth = { [p.root]: 0 }, route = { [p.root]: [] }, queue = [p.root];
    while (queue.length) {
      const n = queue.shift();
      PX.out(p, n).forEach((e, j) => {
        if (depth[e.to] === undefined) { depth[e.to] = depth[n] + 1; route[e.to] = route[n].concat(j); queue.push(e.to); }
      });
    }
    const layers = [];
    Object.keys(depth).forEach((n) => (layers[depth[n]] = layers[depth[n]] || []).push(+n));
    const tallest = Math.max(...layers.map((l) => l.length));
    const DX = 165, DY = 74, H = Math.max(tallest * DY + 60, 300), W = layers.length * DX + 60;
    const pos = {};
    layers.forEach((l, d) => l.sort((a, b) => a - b).forEach((n, i) => (pos[n] = { x: 50 + d * DX, y: H / 2 + (i - (l.length - 1) / 2) * DY })));
    return (layouts[p.id] = { depth, route, pos, W, H });
  }

  PX.candidate = {
    id: "c-",
    render(m) {
      const p = m.p, L = layout(p), n = m.steps.length;
      const onTrace = new Set(m.steps.map((s) => s.edge));
      const choiceSet = new Set(m.choices);
      const lastVisit = {}; m.visited.forEach((node, k) => (lastVisit[node] = k));

      const edges = p.edges.map((e) => {
        const a = L.pos[e.from], b = L.pos[e.to];
        const cls = onTrace.has(e) ? "trace" : choiceSet.has(e) ? "next" : "";
        let d, lx, ly;
        if (b.x > a.x) {
          const mx = (a.x + b.x) / 2;
          d = `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}`; lx = mx; ly = (a.y + b.y) / 2 - 5;
        } else { // goes back to an earlier situation: arc over the top
          const lift = 60 + Math.abs(a.x - b.x) * 0.25;
          d = `M${a.x},${a.y} C${a.x},${a.y - lift} ${b.x},${b.y - lift} ${b.x},${b.y}`; lx = (a.x + b.x) / 2; ly = Math.min(a.y, b.y) - lift * 0.75 - 4;
        }
        const label = cls ? `<text class="${cls}" x="${lx}" y="${ly}" text-anchor="middle">${PX.esc(e.type + (PX.eventData(e) ? " " + PX.eventData(e).slice(0, 26) : ""))}</text>` : "";
        return { cls, html: `<path class="e ${cls}" d="${d}" marker-end="url(#arrow-${cls || "plain"})"><title>${PX.esc(e.event)}</title></path>${label}` };
      });
      const order = { "": 0, next: 1, trace: 2 };
      edges.sort((x, y) => order[x.cls] - order[y.cls]);

      const nodes = Object.keys(L.pos).map(Number).map((node) => {
        const { x, y } = L.pos[node];
        const here = node === m.node;
        const j = m.choices.findIndex((e) => e.to === node);
        let cls = "", nav, tip;
        if (here) { cls = "here"; nav = PX.navTo(m, n); tip = "You are here"; }
        else if (j >= 0) { cls = "next"; nav = PX.navTo(m, n, j); tip = "Next: " + m.choices[j].event; }
        else if (lastVisit[node] !== undefined) { cls = "trace"; nav = PX.navTo(m, lastVisit[node]); tip = "Go back to " + PX.stepName(m, lastVisit[node]); }
        else { nav = PX.hashFor(p, L.route[node]); tip = "Jump here by the shortest route"; }
        const tag = here ? "YOU" : node === p.root ? "START" : "";
        return `<circle class="n ${cls}" cx="${x}" cy="${y}" r="${here ? 11 : 8}" data-nav="${nav}"><title>${PX.esc(tip)}</title></circle>
          ${tag ? `<text class="tag" x="${x}" y="${y + 26}" text-anchor="middle">${tag}</text>` : ""}`;
      }).join("");

      const marker = (id, color) => `<marker id="arrow-${id}" viewBox="0 0 10 10" refX="19" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${color}"/></marker>`;
      const svg = `<svg width="${L.W}" height="${L.H}" viewBox="0 0 ${L.W} ${L.H}">
        <defs>${marker("plain", "#3a3a3a")}${marker("trace", "#8ff5ff")}${marker("next", "#ff6b98")}</defs>
        ${edges.map((e) => e.html).join("")}${nodes}</svg>`;

      const choices = m.choices.length
        ? m.choices.map((e, j) => PX.choiceHtml(m, e, PX.navTo(m, n, j), n + ":" + j)).join("")
        : `<p class="dim" style="margin:0">No choices.</p>`;
      const trace = `<li class="${n ? "" : "here"}"><button data-nav="${PX.navTo(m, 0)}"><span class="num">▶</span><span class="ev-type">START</span></button></li>` +
        m.steps.map((s, k) => `<li class="${k === n - 1 ? "here" : ""}"><button data-nav="${PX.navTo(m, k + 1)}"><span class="num">${k + 1}</span>${PX.eventHtml(s.edge)}</button></li>`).join("");

      return `<div class="c-grid">
        <section class="panel bracket"><h2>${PX.esc(p.name)} · the whole program${p.truncated ? " (as far as it was explored)" : ""}</h2>
          <div class="mapwrap" id="mapwrap">${svg}</div>
          <div class="legend"><span><i style="color:var(--cyan)"></i>the route I took</span><span><i style="color:var(--pink);border-top-style:dashed"></i>what can happen next</span>
            <span><i style="color:#5a5a5a"></i>everything else the program can do</span><span>Click any point to go there.</span></div></section>
        <div class="side">
          ${PX.bannersHtml(m)}
          <section class="panel" style="margin-bottom:20px"><h2>What can happen next${m.choices.length ? ` · ${m.choices.length}` : ""}</h2>${choices}</section>
          <section class="panel"><h2>How I got here</h2><ol class="tl">${trace}</ol></section>
        </div></div>`;
    },
    after(m) {
      const w = document.getElementById("mapwrap"), pos = layout(m.p).pos[m.node];
      if (w && pos) w.scrollLeft = Math.max(0, pos.x - w.clientWidth / 2);
    },
  };
  PX.start();
</script>
</body>
</html>
