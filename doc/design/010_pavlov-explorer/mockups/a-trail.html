<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pavlov Explorer · Candidate A · Trail</title>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    .a-grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .trail { list-style: none; margin: 0; padding: 0; position: relative; }
    .trail::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
    .trail > li { position: relative; padding: 0 0 14px 34px; }
    .dot { position: absolute; left: 0; top: 2px; width: 23px; height: 23px; display: flex; align-items: center; justify-content: center;
           background: var(--bg); border: 1px solid var(--line); font-family: var(--head); font-size: 10px; color: var(--muted); }
    .trail > li.here .dot { background: var(--cyan); color: #003f43; border-color: var(--cyan); box-shadow: 0 0 12px rgba(143,245,255,.7); font-weight: 700; }
    .trail .step { display: block; width: 100%; padding: 3px 6px; }
    .trail .step:hover { background: var(--high); }
    .trail > li.here .step .ev-type, .trail > li.here .start { color: var(--cyan); }
    .start { font-family: var(--head); letter-spacing: .2em; font-size: 12px; font-weight: 700; }
    .alts { margin: 4px 0 0 6px; font-size: 11px; }
    .alts > button.tog { color: var(--pink); font-family: var(--head); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; }
    .alt { display: block; margin: 5px 0 0; padding: 5px 8px; border-left: 2px solid var(--pink); background: var(--high); width: 100%; }
    .alt:hover { background: #2f2f2f; }
    .alt .ev-type { font-weight: 400; font-size: 12px; }
    .herecard { margin-bottom: 20px; }
    .herecard .big { font-family: var(--head); font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 0; word-break: break-word; }
    .herecard .big .ev-type { font-family: var(--head); color: var(--cyan); }
    .herecard .fields { margin-top: 12px; font-size: 13px; }
    .trail .ev-data { display: block; margin: 2px 0 0; font-size: 11px; opacity: .8; }
    .trail .step, .alt { min-width: 0; overflow: hidden; }
    .kw { margin-top: 8px; font-size: 12px; color: var(--dim); }
  </style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
  PX.candidate = {
    id: "a-",
    render(m) {
      const n = m.steps.length;
      // the alternatives of the last step are open unless the user closed them
      PX.defaults = {}; if (n) PX.defaults["sib:" + (n - 1)] = true;

      const trail = m.steps.map((s, k) => {
        const others = s.options.map((e, j) => [e, j]).filter(([, j]) => j !== s.i);
        const open = PX.isOpen("sib:" + k);
        const alts = others.length
          ? `<div class="alts"><button class="tog" data-toggle="sib:${k}">${open ? "▾" : "▸"} ${others.length} alternative${others.length > 1 ? "s" : ""}</button>
               ${open ? others.map(([e, j]) => `<button class="alt" data-nav="${PX.navTo(m, k, j)}" title="Switch to this instead"><span class="dim">instead:</span> ${PX.eventHtml(e)}</button>`).join("") : ""}</div>`
          : `<div class="alts dim">no alternatives</div>`;
        return `<li class="${k === n - 1 ? "here" : ""}"><span class="dot">${k + 1}</span>
          <button class="step" data-nav="${PX.navTo(m, k + 1)}" title="Go back to this point">${PX.eventHtml(s.edge)}</button>${alts}</li>`;
      }).join("");

      const here = m.last
        ? `<div class="label">Step ${n} · what just happened</div><div class="big"><span class="ev-type">${PX.esc(m.last.edge.type)}</span></div>
           ${m.last.edge.keyword ? `<div class="kw">This event carries no data.</div>` : PX.fieldsHtml(m.last.edge, true)}
           <div class="muted" style="margin-top:12px;font-size:12px">requested by ${PX.requestedBy(m.p, m.last.edge)}</div>`
        : `<div class="label">You are at</div><div class="big"><span class="ev-type">THE START</span></div>
           <div class="muted" style="margin-top:6px">${PX.esc(m.p.description)}</div>`;

      const choices = m.choices.length
        ? m.choices.map((e, j) => PX.choiceHtml(m, e, PX.navTo(m, n, j), n + ":" + j)).join("")
        : `<p class="dim" style="margin:0">No choices.</p>`;

      return `<div class="a-grid">
        <section class="panel"><h2>How I got here</h2>
          <ol class="trail">
            <li class="${n ? "" : "here"}"><span class="dot">▶</span><button class="step start" data-nav="${PX.navTo(m, 0)}">START</button></li>
            ${trail}
          </ol></section>
        <div>
          <section class="panel bracket herecard">${here}</section>
          ${PX.bannersHtml(m)}
          <section class="panel"><h2>What can happen next${m.choices.length ? ` · ${m.choices.length}` : ""}</h2>${choices}</section>
        </div></div>`;
    },
  };
  PX.start();
</script>
</body>
</html>
