# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Inputs avoid the github: fetcher, which downloads tarballs from the GitHub
# API/codeload and is blocked in some sandboxes (e.g. Claude's cloud).
inputs:
  # nixpkgs from the nixos-unstable channel release tarball on nixos.org
  # (revision e7439b6b14ad, 2026-10-09). It is a ~40 MB download instead of a
  # git clone of nixpkgs, and builds the same packages as that revision.
  # Replaces github:cachix/devenv-nixpkgs/rolling, whose only additions are
  # patches for lean4, llvm-on-darwin and poetry -- none of which we use.
  # To update: curl -sI https://channels.nixos.org/nixos-unstable | grep location
  nixpkgs:
    url: https://releases.nixos.org/nixos/unstable/nixos-26.11pre1087755.e7439b6b14ad/nixexprs.tar.xz
  # The other inputs use git+https with shallow=1.
  # Must be declared explicitly, otherwise devenv adds it as a github: input.
  devenv:
    url: git+https://github.com/cachix/devenv?rev=a73c5b84c9527760f009232988466763068f9f61&shallow=1&dir=src/modules
  clojure-mcp-light:
    url: git+https://github.com/bhauman/clojure-mcp-light?rev=d341c239d4b1faa58ccefaf8bc0b1e2a312e2af4&shallow=1
    flake: false

# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
